spring:
  application:
    name: clowder
  datasource:
    url: jdbc:postgresql://localhost:5432/clowder_db
    username: clowder_user
    password: clowder_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: always

clowder:
  security:
    # No default. An empty value fails startup with an explanatory message, which is the right
    # trade: a shipped default signing secret is one anybody who read the source can forge with.
    jwt-secret: ${CLOWDER_JWT_SECRET:}
    token-ttl: 8h
    # Unset means the first start generates a password, logs it once and tells you to change it.
    bootstrap-password: ${CLOWDER_BOOTSTRAP_PASSWORD:}
